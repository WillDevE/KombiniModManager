[package]
name = "kombini-storage"
description = "SQLite storage and content-addressed blob store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
kombini-core = { path = "../kombini-core" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
rand = "0.9"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
