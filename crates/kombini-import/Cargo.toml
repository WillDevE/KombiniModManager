[package]
name = "kombini-import"
description = "Imports: unmanaged addons, mod interchange, mod-profile, DMM"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
kombini-core = { path = "../kombini-core" }
kombini-engine = { path = "../kombini-engine" }
kombini-storage = { path = "../kombini-storage" }
kombini-vpk = { path = "../kombini-vpk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
flate2 = "1"
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
