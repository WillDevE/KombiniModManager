[package]
name = "kombini-archive"
description = "Safe zip/7z/rar extraction with magic-byte detection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd", "xz"] }
sevenz-rust2 = "0.25"
unrar = "0.5"
walkdir = "2"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
