[package]
name = "kombini-gamebanana"
description = "GameBanana apiv11 client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
kombini-core = { path = "../kombini-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
