# cargo-deny configuration (CI `supply-chain` job).

[graph]
# The app ships for Windows only.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Security advisories always fail. "Unmaintained" notices only fail for our own
# direct dependencies: the ones deep in the GPUI UI kit (instant, paste,
# rustls-pemfile, ...) are the kit's to replace, not ours.
unmaintained = "workspace"
